name: CI Workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint code
        run: |
          flake8 networksecurity/ app.py main.py \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --exclude=__pycache__

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
